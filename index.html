<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Try It On</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #efe9dd;
    --card: #f8f4ea;
    --ink: #2a2520;
    --ink-soft: #7a7064;
    --pine: #3f5d52;
    --pine-dark: #2d453c;
    --pine-soft: #dde7e1;
    --line: #d6cab0;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }

  body {
    background: var(--paper);
    color: var(--ink);
    font-family: 'Inter', system-ui, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
  }

  .page { width: 100%; max-width: 560px; }

  header { text-align: center; margin-bottom: 30px; }

  h1 {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: clamp(2rem, 5vw, 2.5rem);
    letter-spacing: -0.01em;
    margin: 0 0 10px;
  }

  .sub {
    color: var(--ink-soft);
    margin: 0;
    font-size: 0.98rem;
    line-height: 1.5;
  }

  .visually-hidden {
    position: absolute;
    width: 1px; height: 1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
  }

  .input-row { display: flex; justify-content: center; margin-bottom: 26px; }

  #nameInput {
    width: 100%;
    max-width: 340px;
    min-width: 0;
    font-family: 'Fraunces', serif;
    font-size: 1.5rem;
    text-align: center;
    padding: 8px 4px 10px;
    border: none;
    border-bottom: 2px solid var(--line);
    background: transparent;
    color: var(--ink);
    outline: none;
    transition: border-color 0.2s ease;
  }
  #nameInput::placeholder { color: var(--ink-soft); opacity: 0.7; font-style: italic; }
  #nameInput:focus { border-bottom-color: var(--pine); }

  .sentence-card {
    position: relative;
    background: var(--card);
    border: 1px solid var(--line);
    padding: 26px 26px 20px;
    height: min(60vh, 560px);
    min-height: 320px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    box-shadow: 0 18px 30px -22px rgba(42, 37, 32, 0.45);
    transform: rotate(-0.4deg);
  }

  .sentence-card::before {
    content: "";
    position: absolute;
    top: 0; right: 0;
    width: 0; height: 0;
    border-style: solid;
    border-width: 0 24px 24px 0;
    border-color: transparent var(--paper) transparent transparent;
    filter: drop-shadow(-1px 1px 1px rgba(42, 37, 32, 0.18));
  }

  .context {
    font-size: 0.8rem;
    font-style: italic;
    color: var(--pine);
    margin: 0 0 14px;
    text-align: center;
    flex: 0 0 auto;
  }

  .dialogue-wrap {
    position: relative;
    flex: 1 1 auto;
    min-height: 0;
  }

  .dialogue-scroll {
    flex: 1 1 auto;
    min-height: 0;
    height: 100%;
    overflow-y: auto;
    overscroll-behavior: contain;
    padding: 2px 8px 2px 0;
    scrollbar-gutter: stable;
  }

  .dialogue-wrap::after {
    content: "";
    position: absolute;
    left: 0; right: 8px; bottom: 0;
    height: 30px;
    background: linear-gradient(to bottom, rgba(248, 244, 234, 0) 0%, var(--card) 88%);
    pointer-events: none;
  }

  .dialogue { display: flex; flex-direction: column; gap: 13px; padding-bottom: 6px; }

  .bubble-row {
    display: flex;
    flex-direction: column;
    max-width: 85%;
  }
  .bubble-row.other { align-self: flex-start; align-items: flex-start; }
  .bubble-row.you { align-self: flex-end; align-items: flex-end; }

  .bubble-row.anim { animation: fadeUp 0.4s ease both; }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @media (prefers-reduced-motion: reduce) {
    .bubble-row.anim { animation: none; }
  }

  .speaker { font-size: 0.7rem; color: var(--ink-soft); margin: 0 6px 3px; }
  .bubble-row.you .speaker { color: var(--pine); }

  .bubble {
    font-family: 'Fraunces', serif;
    font-size: clamp(0.98rem, 2.4vw, 1.12rem);
    line-height: 1.4;
    padding: 9px 14px;
    border-radius: 14px;
    overflow-wrap: anywhere;
  }
  .bubble-row.other .bubble {
    background: var(--paper);
    border: 1px solid var(--line);
    border-top-left-radius: 4px;
  }
  .bubble-row.you .bubble {
    background: var(--pine);
    color: #fff;
    border-top-right-radius: 4px;
  }

  .name-hl { font-weight: 600; }
  .bubble-row.other .name-hl { color: var(--pine-dark); }
  .bubble-row.you .name-hl { color: #fff; text-decoration: underline; text-underline-offset: 3px; }
  .name-hl.placeholder { font-weight: 400; font-style: italic; }
  .bubble-row.other .name-hl.placeholder { color: var(--ink-soft); }
  .bubble-row.you .name-hl.placeholder { color: rgba(255, 255, 255, 0.8); text-decoration: none; }

  .dialogue-scroll::-webkit-scrollbar { width: 6px; }
  .dialogue-scroll::-webkit-scrollbar-thumb { background: var(--line); border-radius: 3px; }
  .dialogue-scroll { scrollbar-width: thin; scrollbar-color: var(--line) transparent; }

  .actions {
    display: flex;
    gap: 12px;
    justify-content: center;
    flex-wrap: wrap;
    margin: 20px 0 10px;
  }

  button {
    font-family: 'Inter', sans-serif;
    font-size: 0.92rem;
    font-weight: 500;
    padding: 10px 18px;
    border-radius: 4px;
    cursor: pointer;
    border: 1px solid transparent;
    transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease, opacity 0.15s ease;
  }

  #shuffleBtn { background: var(--pine); color: #fff; border-color: var(--pine); }
  #shuffleBtn:hover { background: var(--pine-dark); border-color: var(--pine-dark); }

  #keepBtn { background: transparent; color: var(--pine); border-color: var(--pine); }
  #keepBtn:hover:not(:disabled) { background: var(--pine-soft); }
  #keepBtn:disabled { opacity: 0.4; cursor: not-allowed; }

  button:focus-visible { outline: 2px solid var(--pine-dark); outline-offset: 2px; }

  .hint {
    text-align: center;
    color: var(--ink-soft);
    font-size: 0.78rem;
    margin: 0 0 28px;
  }

  .kept-wrap { display: none; text-align: center; }
  .kept-label { font-size: 0.82rem; color: var(--ink-soft); margin: 0 0 10px; }
  .kept-list { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }

  .chip {
    display: flex;
    align-items: center;
    gap: 2px;
    background: var(--pine-soft);
    color: var(--pine-dark);
    border-radius: 999px;
    padding: 6px 6px 6px 14px;
    font-size: 0.88rem;
  }
  .chip .chip-name {
    cursor: pointer;
    background: none;
    border: none;
    font-family: 'Inter', sans-serif;
    font-size: 0.88rem;
    color: var(--pine-dark);
    padding: 0;
  }
  .chip .chip-remove {
    background: none;
    border: none;
    color: var(--pine-dark);
    padding: 2px 6px;
    font-size: 0.95rem;
    line-height: 1;
    border-radius: 999px;
  }
  .chip .chip-remove:hover { background: rgba(45, 69, 60, 0.15); }

  @media (max-width: 420px) {
    body { padding: 24px 14px; }
    header { margin-bottom: 22px; }
    .sub { font-size: 0.92rem; }
    .input-row { margin-bottom: 20px; }
    .sentence-card {
      height: min(58vh, 520px);
      min-height: 300px;
      padding: 20px 16px 16px;
    }
    .bubble-row { max-width: 92%; }
    .actions { gap: 8px; margin-top: 16px; }
    button { padding: 9px 14px; }
  }
</style>
</head>
<body>
  <div class="page">
    <header>
      <h1>Try it on</h1>
      <p class="sub">Type a name below and see how it holds up across a real conversation.</p>
    </header>

    <div class="input-row">
      <label for="nameInput" class="visually-hidden">Name to try</label>
      <input id="nameInput" type="text" placeholder="a name" autocomplete="off" spellcheck="false">
    </div>

    <div class="sentence-card">
      <p class="context" id="context"></p>
      <div class="dialogue-wrap">
        <div class="dialogue-scroll" id="dialogueScroll">
          <div class="dialogue" id="dialogue" aria-live="polite"></div>
        </div>
      </div>
    </div>

    <div class="actions">
      <button id="shuffleBtn" type="button">Another scene</button>
      <button id="keepBtn" type="button" disabled>☆ Keep this name</button>
    </div>
    <p class="hint">Press enter for another scene, anytime.</p>

    <div class="kept-wrap" id="keptWrap">
      <p class="kept-label">Names you're keeping</p>
      <div class="kept-list" id="keptList"></div>
    </div>
  </div>

<script src="stories.js"></script>
<script>

  let currentIndex = 0;
  let lastIndex = -1;
  let currentFillers = {};
  let currentLines = [];
  let keptNames = [];
  let currentVariant = 0;

  const nameInput = document.getElementById('nameInput');
  const contextEl = document.getElementById('context');
  const dialogueEl = document.getElementById('dialogue');
  const dialogueScrollEl = document.getElementById('dialogueScroll');
  const shuffleBtn = document.getElementById('shuffleBtn');
  const keepBtn = document.getElementById('keepBtn');
  const keptWrap = document.getElementById('keptWrap');
  const keptList = document.getElementById('keptList');

  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function isYou(speaker) {
    return /^you\b/i.test(speaker.trim());
  }

  function pickScenarioIndex() {
    if (scenarios.length === 1) return 0;
    let idx;
    do {
      idx = Math.floor(Math.random() * scenarios.length);
    } while (idx === lastIndex);
    lastIndex = idx;
    return idx;
  }

  function pickVariant(scenario) {
    const count = scenario.variants.length;
    if (count <= 1) return 0;
    return Math.floor(Math.random() * count);
  }

  function activeScenario() {
    const scenario = scenarios[currentIndex];
    return {
      context: scenario.context,
      lines: scenario.variants[currentVariant].map(([speaker, text]) => ({ speaker, text }))
    };
  }

  function generateFillers(scenario) {
    const keys = new Set();
    const re = /\{(\w+)\}/g;
    scenario.lines.forEach((line) => {
      let m;
      while ((m = re.exec(line.text)) !== null) {
        if (m[1] !== 'name') keys.add(m[1]);
      }
    });
    const fillers = {};
    keys.forEach((k) => {
      const options = SLOTS[k];
      if (options && options.length) {
        fillers[k] = options[Math.floor(Math.random() * options.length)];
      }
    });
    return fillers;
  }

  function renderLineHtml(text, valuesMap) {
    const tokenRegex = /\{(\w+)\}/g;
    let result = '';
    let last = 0;
    let match;
    while ((match = tokenRegex.exec(text)) !== null) {
      result += escapeHtml(text.slice(last, match.index));
      const key = match[1];
      const value = valuesMap[key] !== undefined ? valuesMap[key] : match[0];
      if (key === 'name') {
        const cls = valuesMap.__hasName ? 'name-hl' : 'name-hl placeholder';
        result += '<span class="' + cls + '">' + escapeHtml(value) + '</span>';
      } else {
        result += escapeHtml(value);
      }
      last = tokenRegex.lastIndex;
    }
    result += escapeHtml(text.slice(last));
    return result;
  }

  function buildDialogue(scenario, valuesMap) {
    dialogueEl.innerHTML = '';
    currentLines = [];
    scenario.lines.forEach((line, i) => {
      const row = document.createElement('div');
      row.className = 'bubble-row anim ' + (isYou(line.speaker) ? 'you' : 'other');
      row.style.animationDelay = (i * 70) + 'ms';

      const speakerEl = document.createElement('div');
      speakerEl.className = 'speaker';
      speakerEl.textContent = line.speaker;

      const bubbleEl = document.createElement('div');
      bubbleEl.className = 'bubble';

      row.appendChild(speakerEl);
      row.appendChild(bubbleEl);
      dialogueEl.appendChild(row);
      currentLines.push({ bubbleEl: bubbleEl, text: line.text });
    });
    updateBubbleText(valuesMap);
    if (dialogueScrollEl) dialogueScrollEl.scrollTop = 0;
  }

  function updateBubbleText(valuesMap) {
    currentLines.forEach((item) => {
      item.bubbleEl.innerHTML = renderLineHtml(item.text, valuesMap);
    });
  }

  function render(pickNew) {
    if (pickNew) {
      currentIndex = pickScenarioIndex();
      currentVariant = pickVariant(scenarios[currentIndex]);
      currentFillers = generateFillers(activeScenario());
    }
    const scenario = activeScenario();
    contextEl.textContent = scenario.context;

    const raw = nameInput.value.trim();
    const hasName = raw.length > 0;
    const valuesMap = Object.assign({}, currentFillers, {
      name: hasName ? raw : 'a name',
      __hasName: hasName
    });

    if (pickNew || currentLines.length === 0) {
      buildDialogue(scenario, valuesMap);
    } else {
      updateBubbleText(valuesMap);
    }

    updateKeepBtn();
  }

  function updateKeepBtn() {
    const raw = nameInput.value.trim();
    if (!raw) {
      keepBtn.disabled = true;
      keepBtn.textContent = '☆ Keep this name';
      return;
    }
    keepBtn.disabled = false;
    keepBtn.textContent = keptNames.includes(raw) ? '★ Kept' : '☆ Keep this name';
  }

  function renderKept() {
    keptWrap.style.display = keptNames.length ? 'block' : 'none';
    keptList.innerHTML = '';
    keptNames.forEach((n) => {
      const chip = document.createElement('div');
      chip.className = 'chip';

      const label = document.createElement('button');
      label.type = 'button';
      label.className = 'chip-name';
      label.textContent = n;
      label.addEventListener('click', () => {
        nameInput.value = n;
        render(true);
        nameInput.focus();
      });

      const removeBtn = document.createElement('button');
      removeBtn.type = 'button';
      removeBtn.className = 'chip-remove';
      removeBtn.textContent = '×';
      removeBtn.setAttribute('aria-label', 'Remove ' + n);
      removeBtn.addEventListener('click', () => {
        keptNames = keptNames.filter((x) => x !== n);
        updateKeepBtn();
        renderKept();
      });

      chip.appendChild(label);
      chip.appendChild(removeBtn);
      keptList.appendChild(chip);
    });
  }

  shuffleBtn.addEventListener('click', () => render(true));

  nameInput.addEventListener('input', () => render(false));

  nameInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      e.preventDefault();
      render(true);
    }
  });

  keepBtn.addEventListener('click', () => {
    const raw = nameInput.value.trim();
    if (!raw) return;
    if (keptNames.includes(raw)) {
      keptNames = keptNames.filter((n) => n !== raw);
    } else {
      keptNames.push(raw);
    }
    updateKeepBtn();
    renderKept();
  });

  render(true);
</script>
</body>
</html>
