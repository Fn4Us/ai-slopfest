<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Try It On</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #efe9dd;
    --card: #f8f4ea;
    --ink: #2a2520;
    --ink-soft: #7a7064;
    --pine: #3f5d52;
    --pine-dark: #2d453c;
    --pine-soft: #dde7e1;
    --line: #d6cab0;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }

  body {
    background: var(--paper);
    color: var(--ink);
    font-family: 'Inter', system-ui, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
  }

  .page { width: 100%; max-width: 560px; }

  header { text-align: center; margin-bottom: 30px; }

  h1 {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: clamp(2rem, 5vw, 2.5rem);
    letter-spacing: -0.01em;
    margin: 0 0 10px;
  }

  .sub {
    color: var(--ink-soft);
    margin: 0;
    font-size: 0.98rem;
    line-height: 1.5;
  }

  .visually-hidden {
    position: absolute;
    width: 1px; height: 1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
  }

  .input-row { display: flex; justify-content: center; margin-bottom: 26px; }

  #nameInput {
    width: 100%;
    max-width: 340px;
    min-width: 0;
    font-family: 'Fraunces', serif;
    font-size: 1.5rem;
    text-align: center;
    padding: 8px 4px 10px;
    border: none;
    border-bottom: 2px solid var(--line);
    background: transparent;
    color: var(--ink);
    outline: none;
    transition: border-color 0.2s ease;
  }
  #nameInput::placeholder { color: var(--ink-soft); opacity: 0.7; font-style: italic; }
  #nameInput:focus { border-bottom-color: var(--pine); }

  .sentence-card {
    position: relative;
    background: var(--card);
    border: 1px solid var(--line);
    padding: 26px 26px 20px;
    height: min(60vh, 560px);
    min-height: 320px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    box-shadow: 0 18px 30px -22px rgba(42, 37, 32, 0.45);
    transform: rotate(-0.4deg);
  }

  .sentence-card::before {
    content: "";
    position: absolute;
    top: 0; right: 0;
    width: 0; height: 0;
    border-style: solid;
    border-width: 0 24px 24px 0;
    border-color: transparent var(--paper) transparent transparent;
    filter: drop-shadow(-1px 1px 1px rgba(42, 37, 32, 0.18));
  }

  .context {
    font-size: 0.8rem;
    font-style: italic;
    color: var(--pine);
    margin: 0 0 14px;
    text-align: center;
    flex: 0 0 auto;
  }

  .dialogue-wrap {
    position: relative;
    flex: 1 1 auto;
    min-height: 0;
  }

  .dialogue-scroll {
    flex: 1 1 auto;
    min-height: 0;
    height: 100%;
    overflow-y: auto;
    overscroll-behavior: contain;
    padding: 2px 8px 2px 0;
    scrollbar-gutter: stable;
  }

  .dialogue-wrap::after {
    content: "";
    position: absolute;
    left: 0; right: 8px; bottom: 0;
    height: 30px;
    background: linear-gradient(to bottom, rgba(248, 244, 234, 0) 0%, var(--card) 88%);
    pointer-events: none;
  }

  .dialogue { display: flex; flex-direction: column; gap: 13px; padding-bottom: 6px; }

  .bubble-row {
    display: flex;
    flex-direction: column;
    max-width: 85%;
  }
  .bubble-row.other { align-self: flex-start; align-items: flex-start; }
  .bubble-row.you { align-self: flex-end; align-items: flex-end; }

  .bubble-row.anim { animation: fadeUp 0.4s ease both; }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @media (prefers-reduced-motion: reduce) {
    .bubble-row.anim { animation: none; }
  }

  .speaker { font-size: 0.7rem; color: var(--ink-soft); margin: 0 6px 3px; }
  .bubble-row.you .speaker { color: var(--pine); }

  .bubble {
    font-family: 'Fraunces', serif;
    font-size: clamp(0.98rem, 2.4vw, 1.12rem);
    line-height: 1.4;
    padding: 9px 14px;
    border-radius: 14px;
    overflow-wrap: anywhere;
  }
  .bubble-row.other .bubble {
    background: var(--paper);
    border: 1px solid var(--line);
    border-top-left-radius: 4px;
  }
  .bubble-row.you .bubble {
    background: var(--pine);
    color: #fff;
    border-top-right-radius: 4px;
  }

  .name-hl { font-weight: 600; }
  .bubble-row.other .name-hl { color: var(--pine-dark); }
  .bubble-row.you .name-hl { color: #fff; text-decoration: underline; text-underline-offset: 3px; }
  .name-hl.placeholder { font-weight: 400; font-style: italic; }
  .bubble-row.other .name-hl.placeholder { color: var(--ink-soft); }
  .bubble-row.you .name-hl.placeholder { color: rgba(255, 255, 255, 0.8); text-decoration: none; }

  .dialogue-scroll::-webkit-scrollbar { width: 6px; }
  .dialogue-scroll::-webkit-scrollbar-thumb { background: var(--line); border-radius: 3px; }
  .dialogue-scroll { scrollbar-width: thin; scrollbar-color: var(--line) transparent; }

  .actions {
    display: flex;
    gap: 12px;
    justify-content: center;
    flex-wrap: wrap;
    margin: 20px 0 10px;
  }

  button {
    font-family: 'Inter', sans-serif;
    font-size: 0.92rem;
    font-weight: 500;
    padding: 10px 18px;
    border-radius: 4px;
    cursor: pointer;
    border: 1px solid transparent;
    transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease, opacity 0.15s ease;
  }

  #shuffleBtn { background: var(--pine); color: #fff; border-color: var(--pine); }
  #shuffleBtn:hover { background: var(--pine-dark); border-color: var(--pine-dark); }

  #keepBtn { background: transparent; color: var(--pine); border-color: var(--pine); }
  #keepBtn:hover:not(:disabled) { background: var(--pine-soft); }
  #keepBtn:disabled { opacity: 0.4; cursor: not-allowed; }

  button:focus-visible { outline: 2px solid var(--pine-dark); outline-offset: 2px; }

  .hint {
    text-align: center;
    color: var(--ink-soft);
    font-size: 0.78rem;
    margin: 0 0 28px;
  }

  .kept-wrap { display: none; text-align: center; }
  .kept-label { font-size: 0.82rem; color: var(--ink-soft); margin: 0 0 10px; }
  .kept-list { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }

  .chip {
    display: flex;
    align-items: center;
    gap: 2px;
    background: var(--pine-soft);
    color: var(--pine-dark);
    border-radius: 999px;
    padding: 6px 6px 6px 14px;
    font-size: 0.88rem;
  }
  .chip .chip-name {
    cursor: pointer;
    background: none;
    border: none;
    font-family: 'Inter', sans-serif;
    font-size: 0.88rem;
    color: var(--pine-dark);
    padding: 0;
  }
  .chip .chip-remove {
    background: none;
    border: none;
    color: var(--pine-dark);
    padding: 2px 6px;
    font-size: 0.95rem;
    line-height: 1;
    border-radius: 999px;
  }
  .chip .chip-remove:hover { background: rgba(45, 69, 60, 0.15); }

  @media (max-width: 420px) {
    body { padding: 24px 14px; }
    header { margin-bottom: 22px; }
    .sub { font-size: 0.92rem; }
    .input-row { margin-bottom: 20px; }
    .sentence-card {
      height: min(58vh, 520px);
      min-height: 300px;
      padding: 20px 16px 16px;
    }
    .bubble-row { max-width: 92%; }
    .actions { gap: 8px; margin-top: 16px; }
    button { padding: 9px 14px; }
  }
</style>
</head>
<body>
  <div class="page">
    <header>
      <h1>Try it on</h1>
      <p class="sub">Type a name below and see how it holds up across a real conversation.</p>
    </header>

    <div class="input-row">
      <label for="nameInput" class="visually-hidden">Name to try</label>
      <input id="nameInput" type="text" placeholder="a name" autocomplete="off" spellcheck="false">
    </div>

    <div class="sentence-card">
      <p class="context" id="context"></p>
      <div class="dialogue-wrap">
        <div class="dialogue-scroll" id="dialogueScroll">
          <div class="dialogue" id="dialogue" aria-live="polite"></div>
        </div>
      </div>
    </div>

    <div class="actions">
      <button id="shuffleBtn" type="button">Another scene</button>
      <button id="keepBtn" type="button" disabled>☆ Keep this name</button>
    </div>
    <p class="hint">Press enter for another scene, anytime.</p>

    <div class="kept-wrap" id="keptWrap">
      <p class="kept-label">Names you're keeping</p>
      <div class="kept-list" id="keptList"></div>
    </div>
  </div>

<script>
  const SLOTS = {
    drink: ["an oat milk latte", "a cold brew", "a matcha latte", "a chai latte", "an iced americano", "a hot chocolate"],
    snack: ["a croissant", "a blueberry muffin", "a cinnamon roll", "a bagel with cream cheese", "a scone"],
    dayLooking: ["Tuesday", "weekend", "Wednesday", "Friday", "morning"],
    activity: ["trivia night", "a movie", "board games", "something outdoorsy", "brunch"],
    stressor: ["work deadlines", "moving apartments", "wedding planning", "a big job hunt", "training for a race"],
    newActivity: ["pottery", "rock climbing", "learning guitar", "running", "cooking classes"],
    hobby: ["pottery", "trivia", "rock climbing", "running", "painting", "chess"],
    hangout: ["coffee", "lunch", "drinks", "dinner", "a proper catch-up"],
    newsItem: ["that new restaurant downtown", "Jamie's big move", "the reunion everyone's planning", "that show everyone's binging", "the new place on Main Street"],
    priorJob: ["marketing", "retail management", "freelance design", "customer support", "teaching"],
    reasonForJob: ["the team culture", "the mission", "the flexibility", "the growth opportunities", "the people I met interviewing"],
    officeHazard: ["the third-floor printer", "the coffee after 3pm", "reply-all emails", "the break room microwave", "the office playlist"],
    chore: ["dishes", "laundry", "vacuuming", "recycling", "grocery shopping"],
    chore2: ["walking the dog", "answering some emails", "a nap", "returning some calls", "finishing my coffee"],
    timeSlot: ["Friday", "Saturday", "Sunday afternoon", "tonight", "this weekend"],
    thirdParty: ["Jordan", "Alex", "Sam", "Priya", "Marcus"],
    snackFood: ["pizza", "cookies", "chips", "ice cream", "cake"],
    meetDay: ["Saturday", "Sunday", "Friday night", "tomorrow", "next weekend"],
    meetTime: ["7", "6:30", "8ish", "5:45", "noon"],
    weekday: ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday"],
    careerFocus: ["strategic", "creative", "hands-on", "collaborative", "leadership"],
    trait: ["work well under pressure", "love solving problems", "pick things up quickly", "pay attention to detail", "work well with a team", "stay calm when things get hectic"],
    growthArea: ["delegating more", "public speaking", "saying no to extra projects", "getting better at documentation", "not micromanaging myself"],
    timeframe: ["six months", "the first year", "90 days", "the first quarter", "a year"],
    successMetric: ["leading your own projects", "fully ramped up with the team", "contributing to key decisions", "mentoring newer hires", "owning a full workstream"],
    concernTopic: ["the team's current workload", "how remote work is handled", "the timeline for this role", "the team structure", "growth opportunities here"],
    field: ["marketing", "software", "teaching", "healthcare", "design", "finance"],
    relative: ["Your cousin", "Your uncle", "Your brother", "Your aunt", "Your grandma"],
    occasion: ["the holidays", "Thanksgiving", "the family reunion", "my birthday", "the Fourth of July"],
    dish: ["grilled salmon", "mushroom risotto", "veggie burger", "pad thai", "roasted chicken"]
  };

  const scenarios = [
    { context: "Coffee shop regular", lines: [
        { speaker: "Barista", text: "Hey, {name}! The usual today, or feeling adventurous?" },
        { speaker: "You", text: "Let's go adventurous — could I get {drink}?" },
        { speaker: "Barista", text: "Ooh, I like it. Anything to eat with that?" },
        { speaker: "You", text: "Just {snack}, thanks." },
        { speaker: "Barista", text: "Coming right up. How's your {dayLooking} looking?" },
        { speaker: "You", text: "Busy, honestly. Trying to squeeze in {activity} before it gets dark." },
        { speaker: "Barista", text: "Say no more, this'll help. You know, {name}, you're in here so much I should start a tab." },
        { speaker: "You", text: "Careful what you offer — I might take you up on it." },
        { speaker: "Barista", text: "Ha! I mean it though. Regulars get perks eventually." },
        { speaker: "You", text: "Is that your way of saying I'm here too much?" },
        { speaker: "Barista", text: "Not at all, {name}. I look forward to it, honestly." },
        { speaker: "You", text: "That's sweet. Also slightly concerning for my bank account." },
        { speaker: "Barista", text: "Fair. Alright, {drink} — all set." },
        { speaker: "You", text: "Perfect timing. Smells amazing." },
        { speaker: "Barista", text: "Made it a little stronger today. Figured you could use it." },
        { speaker: "You", text: "You know me well. Thank you." },
        { speaker: "Barista", text: "Anytime, {name}. Good luck with the rest of your {dayLooking}." },
        { speaker: "You", text: "Will do. See you tomorrow, probably." }
    ]},
    { context: "A blind date", lines: [
        { speaker: "Date", text: "{name}? I thought that might be you — sorry, I'm always nervous I'll wave at the wrong person." },
        { speaker: "You", text: "Ha, no, you got the right one. I'm glad it's you." },
        { speaker: "Date", text: "Good, because I already told the host we were meeting someone. Would've been awkward." },
        { speaker: "You", text: "Very. Good save either way." },
        { speaker: "Date", text: "So, {name}, how's your week been?" },
        { speaker: "You", text: "Honestly kind of a whirlwind. I spent most of it on {stressor}." },
        { speaker: "Date", text: "That sounds like a lot. Did it turn out okay?" },
        { speaker: "You", text: "Mostly, yeah. I'm just glad to sit down now." },
        { speaker: "Date", text: "Same. Can I get you {drink} or something stronger?" },
        { speaker: "You", text: "I'd love {drink}, actually." },
        { speaker: "Date", text: "Good choice. So tell me something about you that's not on your profile." },
        { speaker: "You", text: "Okay... I'm weirdly competitive about {hobby}. It's a whole thing." },
        { speaker: "Date", text: "That's amazing. I need to see this in action sometime." },
        { speaker: "You", text: "Careful what you wish for — I don't lose gracefully." },
        { speaker: "Date", text: "Noted. I respect that, {name}." },
        { speaker: "You", text: "Good. What about you — hidden talents, embarrassing hobbies?" },
        { speaker: "Date", text: "I make a genuinely excellent {dish}. Ask anyone." },
        { speaker: "You", text: "Bold claim. I'll need proof eventually." }
    ]},
    { context: "Catching up with an old friend", lines: [
        { speaker: "Friend", text: "{name}! Oh my gosh, it has been way too long." },
        { speaker: "You", text: "It really has. You look great, by the way." },
        { speaker: "Friend", text: "Stop, so do you. Come here, sit, tell me everything." },
        { speaker: "You", text: "Where do I even start... things have actually been pretty good." },
        { speaker: "Friend", text: "Yeah? Last I heard you were buried in {stressor}." },
        { speaker: "You", text: "I was. Finally free of that — now I'm somehow into {newActivity} instead." },
        { speaker: "Friend", text: "Ha, of course you are. You always find something to fill your time." },
        { speaker: "You", text: "Can't help it. What about you — still doing {hobby}?" },
        { speaker: "Friend", text: "Every {weekday}, actually. It's basically my whole personality now." },
        { speaker: "You", text: "I love that for you, honestly." },
        { speaker: "Friend", text: "We should really get {hangout} more often, {name}. I miss this." },
        { speaker: "You", text: "Agreed. No more year-long gaps, deal?" },
        { speaker: "Friend", text: "Deal. I'm holding you to it." },
        { speaker: "You", text: "Good, hold me accountable — I clearly need it." },
        { speaker: "Friend", text: "Oh, before I forget — did you hear about {newsItem}?" },
        { speaker: "You", text: "No! Tell me everything, I've clearly been out of the loop." },
        { speaker: "Friend", text: "Get comfortable, {name}. This is a whole story." },
        { speaker: "You", text: "I've got nowhere to be. Go." }
    ]},
    { context: "First day at a new job", lines: [
        { speaker: "Coworker", text: "You must be {name} — welcome aboard! I'm supposed to show you around." },
        { speaker: "You", text: "Thank you, I appreciate it. This place is bigger than I expected." },
        { speaker: "Coworker", text: "Right? Took me weeks to stop getting lost. Coffee machine's this way, most important stop." },
        { speaker: "You", text: "Good priorities. Lead the way." },
        { speaker: "Coworker", text: "So where'd you work before this, {name}?" },
        { speaker: "You", text: "I was doing {priorJob} for a few years, then decided it was time for a change." },
        { speaker: "Coworker", text: "Nice. What made you land here specifically?" },
        { speaker: "You", text: "Honestly, {reasonForJob} really stood out to me." },
        { speaker: "Coworker", text: "That tracks, it's a big draw for a lot of us. You'll fit right in." },
        { speaker: "You", text: "That's good to hear. I was a little nervous, not going to lie." },
        { speaker: "Coworker", text: "Everyone is on day one, {name}. You get used to it fast." },
        { speaker: "You", text: "I hope so. Any advice for surviving the first week?" },
        { speaker: "Coworker", text: "Ask questions, don't be afraid to admit when you're lost, and never skip the {weekday} team lunch." },
        { speaker: "You", text: "Noted. Team lunch is non-negotiable, got it." },
        { speaker: "Coworker", text: "Exactly. Oh, and steer clear of {officeHazard} — long story." },
        { speaker: "You", text: "Now I have to know the story." },
        { speaker: "Coworker", text: "Ask me again after your first week, {name}. You'll understand." },
        { speaker: "You", text: "Deal. I'll hold you to that." }
    ]},
    { context: "Living with a roommate", lines: [
        { speaker: "Roommate", text: "{name}, please tell me you didn't eat my {snackFood}." },
        { speaker: "You", text: "...I might have. In my defense, I was very hungry." },
        { speaker: "Roommate", text: "That was for tomorrow! You're the worst." },
        { speaker: "You", text: "I'll replace it, I promise. I'll even get the good kind." },
        { speaker: "Roommate", text: "You'd better. Also, did you do the {chore} yet?" },
        { speaker: "You", text: "Working on it. It's on my list, right after {chore2}." },
        { speaker: "Roommate", text: "Your list is just vibes at this point, {name}." },
        { speaker: "You", text: "Harsh but fair. I'll get to it tonight, I swear." },
        { speaker: "Roommate", text: "Sure you will. Are we still doing {activity} {timeSlot}?" },
        { speaker: "You", text: "Yes! I've actually been looking forward to that all week." },
        { speaker: "Roommate", text: "Good, because I already told people we're hosting." },
        { speaker: "You", text: "Wait, hosting? How many people, exactly?" },
        { speaker: "Roommate", text: "A few. Okay, maybe more than a few. It's fine, we'll figure it out." },
        { speaker: "You", text: "This is exactly the kind of chaos I signed up for, apparently." },
        { speaker: "Roommate", text: "You knew what you were getting into when you moved in, {name}." },
        { speaker: "You", text: "I really did not, but here we are." },
        { speaker: "Roommate", text: "Here we are. Now go do the {chore}, please." },
        { speaker: "You", text: "Fine. But you owe me for the {snackFood} thing." }
    ]},
    { context: "A text thread", lines: [
        { speaker: "Friend (text)", text: "hey {name} you around this weekend?" },
        { speaker: "You (text)", text: "yeah should be free, what's up" },
        { speaker: "Friend (text)", text: "few of us are doing {activity}, you in?" },
        { speaker: "You (text)", text: "depends, is {thirdParty} going" },
        { speaker: "Friend (text)", text: "unfortunately yes lol" },
        { speaker: "You (text)", text: "lmaooo fine i'll come anyway" },
        { speaker: "Friend (text)", text: "knew i could count on you {name}" },
        { speaker: "You (text)", text: "don't get used to it" },
        { speaker: "Friend (text)", text: "also bringing {snackFood} if you want some" },
        { speaker: "You (text)", text: "say less, i'm in" },
        { speaker: "Friend (text)", text: "perfect. {meetDay} work for you?" },
        { speaker: "You (text)", text: "should be good, what time" },
        { speaker: "Friend (text)", text: "probably around {meetTime}, i'll send details" },
        { speaker: "You (text)", text: "sounds good, see you then" },
        { speaker: "Friend (text)", text: "don't be late this time {name}" },
        { speaker: "You (text)", text: "no promises but i'll try" },
        { speaker: "Friend (text)", text: "that's all i ask honestly" },
        { speaker: "You (text)", text: "fair. see you {meetDay}." }
    ]},
    { context: "A job interview", lines: [
        { speaker: "Interviewer", text: "Thanks for coming in, {name}. Should we just dive in?" },
        { speaker: "You", text: "Sounds good to me." },
        { speaker: "Interviewer", text: "Tell me a bit about your background." },
        { speaker: "You", text: "Sure — I spent a few years in {priorJob}, and I've been looking to grow into a more {careerFocus} role." },
        { speaker: "Interviewer", text: "That makes sense. What would you say is your biggest strength?" },
        { speaker: "You", text: "Honestly, I think it's that I {trait}." },
        { speaker: "Interviewer", text: "Good one. And on the flip side — where do you think you could improve?" },
        { speaker: "You", text: "I'm working on {growthArea}, if I'm being honest." },
        { speaker: "Interviewer", text: "I appreciate the honesty. Why us, specifically?" },
        { speaker: "You", text: "Honestly, {reasonForJob} really drew me in." },
        { speaker: "Interviewer", text: "Good answer. Do you have any questions for me?" },
        { speaker: "You", text: "I do, actually — what does success look like after {timeframe} in this role?" },
        { speaker: "Interviewer", text: "Great question. We'd want to see you {successMetric}." },
        { speaker: "You", text: "That's really helpful context, thank you." },
        { speaker: "Interviewer", text: "Of course. Last thing — any concerns about the role so far?" },
        { speaker: "You", text: "Not really, though I am curious about {concernTopic}." },
        { speaker: "Interviewer", text: "Fair question. We can go over that in detail. Thanks again for your time, {name}." },
        { speaker: "You", text: "Thank you, I really enjoyed this conversation." }
    ]},
    { context: "Meeting someone at a party", lines: [
        { speaker: "Someone new", text: "Hi, I don't think we've met — I'm supposed to know everyone here somehow." },
        { speaker: "You", text: "I'm {name}. Honestly, I don't know many people either." },
        { speaker: "Someone new", text: "Good, solidarity. How do you know the host?" },
        { speaker: "You", text: "We used to work together, actually. You?" },
        { speaker: "Someone new", text: "Childhood friends, believe it or not. So, {name}, what do you do these days?" },
        { speaker: "You", text: "I'm in {field}, mostly. Keeps me busier than I'd like." },
        { speaker: "Someone new", text: "That sounds intense. Do you actually enjoy it?" },
        { speaker: "You", text: "Most days, yeah. It helps that I'm into {hobby} outside of work." },
        { speaker: "Someone new", text: "Oh, I love that. How'd you get into it?" },
        { speaker: "You", text: "Honestly, kind of by accident. A friend dragged me along once and it stuck." },
        { speaker: "Someone new", text: "Those are the best kinds of hobbies. I'm still looking for mine." },
        { speaker: "You", text: "You should come try it sometime — always looking for more people." },
        { speaker: "Someone new", text: "I might actually take you up on that, {name}." },
        { speaker: "You", text: "I'll hold you to it." },
        { speaker: "Someone new", text: "Deal. This has been way better than the small talk I was expecting tonight." },
        { speaker: "You", text: "Same, honestly. Glad we ended up talking." },
        { speaker: "Someone new", text: "Me too, {name}. Let's actually exchange numbers before I forget." },
        { speaker: "You", text: "Good call, I was going to suggest the same thing." }
    ]},
    { context: "A weekend call with Mom", lines: [
        { speaker: "Mom", text: "Hi sweetie, I was just thinking about you." },
        { speaker: "You", text: "Hi Mom, that's funny, I was actually about to call you." },
        { speaker: "Mom", text: "Great minds. How's everything going, {name}?" },
        { speaker: "You", text: "Pretty good, actually. Been busy with {stressor}, but it's manageable." },
        { speaker: "Mom", text: "You always say that. Are you eating enough? Sleeping enough?" },
        { speaker: "You", text: "Yes, Mom, I'm eating. I'm an adult, I promise." },
        { speaker: "Mom", text: "I know, I know. I still worry, that's my job." },
        { speaker: "You", text: "I appreciate it, really. How's everyone back home?" },
        { speaker: "Mom", text: "Good! {relative} just started {newActivity}, if you can believe that." },
        { speaker: "You", text: "No way, that's amazing. Good for them." },
        { speaker: "Mom", text: "Right? Anyway, are you coming home for {occasion} this year?" },
        { speaker: "You", text: "I'm planning on it, yeah. Wouldn't miss it." },
        { speaker: "Mom", text: "Good, because I already told everyone you'd be there, {name}." },
        { speaker: "You", text: "No pressure, then." },
        { speaker: "Mom", text: "None at all. Call me before you book anything, okay?" },
        { speaker: "You", text: "I will, I promise. Love you, Mom." },
        { speaker: "Mom", text: "Love you too, sweetie. Talk soon." },
        { speaker: "You", text: "Talk soon. Bye, Mom." }
    ]}
  ];

  let currentIndex = 0;
  let lastIndex = -1;
  let currentFillers = {};
  let currentLines = [];
  let keptNames = [];

  const nameInput = document.getElementById('nameInput');
  const contextEl = document.getElementById('context');
  const dialogueEl = document.getElementById('dialogue');
  const dialogueScrollEl = document.getElementById('dialogueScroll');
  const shuffleBtn = document.getElementById('shuffleBtn');
  const keepBtn = document.getElementById('keepBtn');
  const keptWrap = document.getElementById('keptWrap');
  const keptList = document.getElementById('keptList');

  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function isYou(speaker) {
    return /^you\b/i.test(speaker.trim());
  }

  function pickScenarioIndex() {
    if (scenarios.length === 1) return 0;
    let idx;
    do {
      idx = Math.floor(Math.random() * scenarios.length);
    } while (idx === lastIndex);
    lastIndex = idx;
    return idx;
  }

  function generateFillers(scenario) {
    const keys = new Set();
    const re = /\{(\w+)\}/g;
    scenario.lines.forEach((line) => {
      let m;
      while ((m = re.exec(line.text)) !== null) {
        if (m[1] !== 'name') keys.add(m[1]);
      }
    });
    const fillers = {};
    keys.forEach((k) => {
      const options = SLOTS[k];
      if (options && options.length) {
        fillers[k] = options[Math.floor(Math.random() * options.length)];
      }
    });
    return fillers;
  }

  function renderLineHtml(text, valuesMap) {
    const tokenRegex = /\{(\w+)\}/g;
    let result = '';
    let last = 0;
    let match;
    while ((match = tokenRegex.exec(text)) !== null) {
      result += escapeHtml(text.slice(last, match.index));
      const key = match[1];
      const value = valuesMap[key] !== undefined ? valuesMap[key] : match[0];
      if (key === 'name') {
        const cls = valuesMap.__hasName ? 'name-hl' : 'name-hl placeholder';
        result += '<span class="' + cls + '">' + escapeHtml(value) + '</span>';
      } else {
        result += escapeHtml(value);
      }
      last = tokenRegex.lastIndex;
    }
    result += escapeHtml(text.slice(last));
    return result;
  }

  function buildDialogue(scenario, valuesMap) {
    dialogueEl.innerHTML = '';
    currentLines = [];
    scenario.lines.forEach((line, i) => {
      const row = document.createElement('div');
      row.className = 'bubble-row anim ' + (isYou(line.speaker) ? 'you' : 'other');
      row.style.animationDelay = (i * 70) + 'ms';

      const speakerEl = document.createElement('div');
      speakerEl.className = 'speaker';
      speakerEl.textContent = line.speaker;

      const bubbleEl = document.createElement('div');
      bubbleEl.className = 'bubble';

      row.appendChild(speakerEl);
      row.appendChild(bubbleEl);
      dialogueEl.appendChild(row);
      currentLines.push({ bubbleEl: bubbleEl, text: line.text });
    });
    updateBubbleText(valuesMap);
    if (dialogueScrollEl) dialogueScrollEl.scrollTop = 0;
  }

  function updateBubbleText(valuesMap) {
    currentLines.forEach((item) => {
      item.bubbleEl.innerHTML = renderLineHtml(item.text, valuesMap);
    });
  }

  function render(pickNew) {
    if (pickNew) {
      currentIndex = pickScenarioIndex();
      currentFillers = generateFillers(scenarios[currentIndex]);
    }
    const scenario = scenarios[currentIndex];
    contextEl.textContent = scenario.context;

    const raw = nameInput.value.trim();
    const hasName = raw.length > 0;
    const valuesMap = Object.assign({}, currentFillers, {
      name: hasName ? raw : 'a name',
      __hasName: hasName
    });

    if (pickNew || currentLines.length === 0) {
      buildDialogue(scenario, valuesMap);
    } else {
      updateBubbleText(valuesMap);
    }

    updateKeepBtn();
  }

  function updateKeepBtn() {
    const raw = nameInput.value.trim();
    if (!raw) {
      keepBtn.disabled = true;
      keepBtn.textContent = '☆ Keep this name';
      return;
    }
    keepBtn.disabled = false;
    keepBtn.textContent = keptNames.includes(raw) ? '★ Kept' : '☆ Keep this name';
  }

  function renderKept() {
    keptWrap.style.display = keptNames.length ? 'block' : 'none';
    keptList.innerHTML = '';
    keptNames.forEach((n) => {
      const chip = document.createElement('div');
      chip.className = 'chip';

      const label = document.createElement('button');
      label.type = 'button';
      label.className = 'chip-name';
      label.textContent = n;
      label.addEventListener('click', () => {
        nameInput.value = n;
        render(true);
        nameInput.focus();
      });

      const removeBtn = document.createElement('button');
      removeBtn.type = 'button';
      removeBtn.className = 'chip-remove';
      removeBtn.textContent = '×';
      removeBtn.setAttribute('aria-label', 'Remove ' + n);
      removeBtn.addEventListener('click', () => {
        keptNames = keptNames.filter((x) => x !== n);
        updateKeepBtn();
        renderKept();
      });

      chip.appendChild(label);
      chip.appendChild(removeBtn);
      keptList.appendChild(chip);
    });
  }

  shuffleBtn.addEventListener('click', () => render(true));

  nameInput.addEventListener('input', () => render(false));

  nameInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      e.preventDefault();
      render(true);
    }
  });

  keepBtn.addEventListener('click', () => {
    const raw = nameInput.value.trim();
    if (!raw) return;
    if (keptNames.includes(raw)) {
      keptNames = keptNames.filter((n) => n !== raw);
    } else {
      keptNames.push(raw);
    }
    updateKeepBtn();
    renderKept();
  });

  render(true);
</script>
</body>
</html>
